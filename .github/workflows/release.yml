name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v0.2.0
      - "v[0-9]+.[0-9]+.[0-9]+.*"       # e.g. v0.2.0rc1

permissions:
  contents: write   # create GitHub Release
  id-token: write   # trusted publishing to PyPI (OIDC)

jobs:
  test:
    name: "Pre-release tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv --python 3.12

      - name: Install project
        run: uv pip install -e ".[dev]"

      - name: Run full test suite
        run: uv run pytest --tb=short -q

  build:
    name: "Build distributions"
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build wheel and sdist
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate release notes from CHANGELOG
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")
          try:
              text = open("CHANGELOG.md").read()
              pattern = rf"(## \[{re.escape(tag)}\].*?)(?=\n## \[|\Z)"
              m = re.search(pattern, text, re.DOTALL)
              notes = m.group(1).strip() if (m and tag) else open("CHANGELOG.md").read()
              open("release_notes.md", "w").write(notes)
          except Exception as e:
              open("release_notes.md", "w").write(f"Release {tag}\n")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AVI ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  pypi-publish:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [build, github-release]
    environment: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        # Requires PyPI "Trusted Publisher" configured for this repo.
        # No API token needed — uses GitHub OIDC identity.
