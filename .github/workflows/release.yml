name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v0.2.0
      - "v[0-9]+.[0-9]+.[0-9]+.*"       # e.g. v0.2.0rc1

permissions:
  contents: write   # create GitHub Release
  id-token: write   # trusted publishing to PyPI (OIDC)

jobs:
  test:
    name: "Pre-release tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv --python 3.12

      - name: Install project
        run: uv pip install -e ".[dev]"

      - name: Run full test suite
        run: uv run pytest --tb=short -q

  build:
    name: "Build distributions"
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build wheel and sdist
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14

  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          VERSION=${{ needs.build.outputs.version }}
          # Extract section for this version from CHANGELOG.md
          python3 - <<'EOF'
          import re, sys
          version = "${{ needs.build.outputs.version }}"
          try:
              text = open("CHANGELOG.md").read()
              # Match section starting with ## [version] through next ## or end
              pattern = rf"(## \[{re.escape(version)}\].*?)(?=\n## \[|\Z)"
              m = re.search(pattern, text, re.DOTALL)
              notes = m.group(1).strip() if m else f"Release v{version}"
              open("release_notes.md", "w").write(notes)
          except Exception as e:
              open("release_notes.md", "w").write(f"Release v{version}\n")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AVI v${{ needs.build.outputs.version }}"
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  pypi-publish:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [github-release]
    environment: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # Requires PyPI "Trusted Publisher" configured for this repo.
        # No API token needed — uses GitHub OIDC identity.
